    <script>
      (function() {
        // Suppress and safely handle Vite HMR WebSocket in preview/iframe environment
        var origError = console.error;
        console.error = function() {
          var str = Array.prototype.map.call(arguments, function(a) {
            return (a && (a.message || a.stack || '' + a)) || '';
          }).join(' ');
          if (str.indexOf('WebSocket') !== -1 && (str.indexOf('closed without opened') !== -1 || str.indexOf('server connection lost') !== -1)) {
            return;
          }
          if (str.indexOf('popup-blocked') !== -1 || str.indexOf('popup-closed') !== -1 || str.indexOf('network-request-failed') !== -1) {
            console.warn('[Firebase Auth Preview Handling]', str);
            return;
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('WebSocket closed without opened') !== -1 || (msg.indexOf('WebSocket') !== -1 && msg.indexOf('closed') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
          if (msg.indexOf('popup-blocked') !== -1 || msg.indexOf('popup-closed') !== -1 || msg.indexOf('network-request-failed') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || '' + e.reason)) || '';
          if (msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('popup-blocked') !== -1 ||
              msg.indexOf('popup-closed') !== -1 ||
              msg.indexOf('network-request-failed') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var isViteHmr = (typeof protocols === 'string' && protocols === 'vite-hmr') ||
                              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));
              if (isViteHmr) {
                var dummyTarget = document.createDocumentFragment();
                var dummyWs = {
                  readyState: 3,
                  url: url,
                  protocol: 'vite-hmr',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  onopen: null,
                  onmessage: null,
                  onerror: null,
                  onclose: null,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, listener) {
                    dummyTarget.addEventListener(type, listener);
                  },
                  removeEventListener: function(type, listener) {
                    dummyTarget.removeEventListener(type, listener);
                  },
                  dispatchEvent: function(e) {
                    return dummyTarget.dispatchEvent(e);
                  }
                };
                return dummyWs;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}
      })();
    </script>
