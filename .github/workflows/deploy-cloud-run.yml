name: Deploy Spana to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVICE_NAME: spana-platform
  REGION: ${{ vars.GCP_REGION || 'europe-west2' }}

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy from Dockerfile to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: .
          flags: >-
            --allow-unauthenticated
            --port=3000
          env_vars: |
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            FASTAPI_RECOMMENDER_URL=${{ secrets.FASTAPI_RECOMMENDER_URL }}

      - name: Print Live Service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
